# 타겟 IDE: IC = IntelliJ IDEA Community.
# 자바 PSI 와 플랫폼 확장점만 쓰므로 Ultimate 불필요(Community/Ultimate 모두 호환).
platformType = IC
# 타겟 버전 핀 — 빌드가 안 맞으면 여기 숫자만 바꾸면 된다.
platformVersion = 2024.3.1

# 번들 플러그인 의존.
#  - com.intellij.java : 자바 PSI (애노테이션·생성자·메서드 읽기)
# Lombok 번들 플러그인에는 컴파일 의존을 걸지 않는다. 이 플러그인은 Lombok 이 PsiAugmentProvider 로
# 만들어 둔 멤버를 표준 PSI(findMethodsByName 등)로 조회하기만 하므로 클래스 의존이 필요 없다.
platformBundledPlugins = com.intellij.java

# 개발·테스트 전용 마켓플레이스 플러그인. 배포물의 런타임 의존성이 아니다
# (plugin.xml 의 depends 에는 넣지 않는다 — Lombok 없이도 조용히 동작해야 하므로).
#  - Lombook Plugin : JetBrains 의 Lombok 지원. id 의 오타는 JetBrains 쪽 역사적 표기다.
#    IntelliJ IDEA Community 에는 번들되어 있지 않아(IC 2024.3.1 번들 74개 중 없음) 직접 받아야 한다.
#    이게 없으면 빌더가 증강되지 않아 runIde 샌드박스와 테스트가 모두 무의미해진다.
platformPlugins = Lombook Plugin:243.22562.218

# 이 플러그인이 지원하는 최소 빌드 (243 = 2024.3.x)
pluginSinceBuild = 243

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
